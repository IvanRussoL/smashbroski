{% extends "base.html" %}

{% block titolo %}Accesso – SmashBroski Pompei{% endblock %}

{% block contenuto %}
<div class="pagina-testo pagina-modulo">
    <h1>Accesso all'area riservata</h1>
    {% if errore %}<p class="errori" role="alert">{{ errore }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="username" required>
        </p>
        <p>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </p>
        <p><button class="pulsante-modulo" type="submit">Entra</button></p>
    </form>
</div>
{% endblock %}
